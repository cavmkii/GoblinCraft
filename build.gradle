plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // Custom icons: drop a 16x16 PNG at assets/seancraft/textures/item/<item id>.png and that item's model uses it
    // in the built jar, in place of the stand-in vanilla texture. See ICONS.md.
    def itemTextures = file('src/main/resources/assets/seancraft/textures/item')
    filesMatching('assets/seancraft/models/item/*.json') { details ->
        def name = details.name.replace('.json', '')
        if (new File(itemTextures, name + '.png').exists()) {
            def first = true
            details.filter { line ->
                def out = first ? "{\"parent\": \"minecraft:item/generated\", \"textures\": {\"layer0\": \"seancraft:item/${name}\"}}" : ''
                first = false
                return out
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
